    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', sans-serif;
        }
        .hero-bg {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                        url('https://picsum.photos/id/1016/1920/1080') center/cover no-repeat;
            height: 100vh;
        }
        .nav-link {
            position: relative;
        }
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -6px;
            left: 0;
            background-color: #14b8a6;
        }
        .nav-link:hover:after {
            width: 100%;
        }
        .section-title:after {
            content: '';
            position: absolute;
            width: 70px;
            height: 4px;
            background: #14b8a6;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
        }
        .card {
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - LUMINA Hotel Kigali</title>
    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-950 text-slate-200">

    <!-- Navbar (copy from previous files) -->

    <div class="max-w-2xl mx-auto px-6 py-20">
        <h1 class="text-5xl font-bold text-center section-title mb-12">Get In Touch</h1>

        <form id="contactForm" class="bg-slate-900 p-10 rounded-3xl space-y-8">
            <div class="grid md:grid-cols-2 gap-6">
                <div><label class="block text-sm mb-2">Full Name</label><input type="text" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4"></div>
                <div><label class="block text-sm mb-2">Email</label><input type="email" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4"></div>
            </div>
            <div class="grid md:grid-cols-2 gap-6">
                <div><label class="block text-sm mb-2">Phone</label><input type="tel" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4"></div>
                <div><label class="block text-sm mb-2">Location</label><input type="text" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4"></div>
            </div>
            <div>
                <label class="block text-sm mb-2">Message</label>
                <textarea rows="6" required class="w-full bg-slate-800 border border-slate-700 rounded-3xl px-6 py-4"></textarea>
            </div>
            <button type="submit" class="w-full py-6 bg-teal-400 hover:bg-teal-500 text-slate-900 font-bold text-xl rounded-3xl">
                SEND MESSAGE
            </button>
        </form>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("✅ Thank you! Your message has been received.");
            this.reset();
        });
    </script>
    <footer class="bg-slate-900 py-12">
        <div class="max-w-7xl mx-auto px-6 text-center text-slate-400">
            <p>&copy; 2026 Lumina Hotel Kigali.</p>
            
        </div>
    </footer>
</body>
