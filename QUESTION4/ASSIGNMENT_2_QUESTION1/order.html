<!DOCTYPE html>
<html lang="en">
head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA Hotel Kigali - Luxury Redefined</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', sans-serif;
        }
        .hero-bg {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                        url('https://picsum.photos/id/1016/1920/1080') center/cover no-repeat;
            height: 100vh;
        }
        .nav-link {
            position: relative;
        }
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -6px;
            left: 0;
            background-color: #14b8a6;
        }
        .nav-link:hover:after {
            width: 100%;
        }
        .section-title:after {
            content: '';
            position: absolute;
            width: 70px;
            height: 4px;
            background: #14b8a6;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
        }
        .card {
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">

    <!-- NAVBAR -->
    <nav class="bg-slate-900 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6">

                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 bg-teal-400 rounded-2xl flex items-center justify-center text-slate-900 text-4xl font-bold">L</div>
                    <div>
                        <span class="text-3xl font-bold tracking-tighter">LUMINA</span>
                        <span class="text-teal-400 text-sm font-medium block -mt-1">HOTEL KIGALI</span>
                    </div>
                </div>

                <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                    <a href="index.html" class="nav-link text-slate-300 hover:text-white">HOME</a>
                    <a href="about.html" class="nav-link text-slate-300 hover:text-white">ABOUT US</a>
                    <a href="menu.html" class="nav-link text-slate-300 hover:text-white">MENU</a>
                    <a href="gallery.html" class="nav-link text-slate-300 hover:text-white">GALLERY</a>
                    <a href="order.html" class="nav-link text-slate-300 hover:text-white">ORDER NOW</a>
                    <a href="contact.html" class="nav-link text-slate-300 hover:text-white">CONTACT</a>
                </div>

                <button onclick="toggleMobileMenu()" class="md:hidden text-3xl text-slate-300">
                    <i class="fa-solid fa-bars" id="hamburger"></i>
                </button>
            </div>
        </div>
<body class="bg-slate-950 text-slate-200">

    <!-- Navbar (copy from previous) -->

    <div class="max-w-2xl mx-auto px-6 py-20">
        <h1 class="text-5xl font-bold text-center section-title mb-12">Order Food Online</h1>

        <div id="success" class="hidden bg-green-500/20 border border-green-500 text-green-400 p-6 rounded-3xl text-center mb-8">
            ✅ Order placed successfully! Our team will deliver shortly.
        </div>

        <form id="orderForm" class="bg-slate-900 p-10 rounded-3xl space-y-8">
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm mb-2">Full Name</label>
                    <input type="text" id="fullName" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4">
                </div>
                <div>
                    <label class="block text-sm mb-2">Email</label>
                    <input type="email" id="email" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm mb-2">Phone</label>
                    <input type="tel" id="phone" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4">
                </div>
                <div>
                    <label class="block text-sm mb-2">Select Menu Item</label>
                    <select id="menuItem" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4">
                        <option value="">Choose item...</option>
                        <option value="Grilled Tilapia">Grilled Tilapia</option>
                        <option value="Brochettes">Brochettes</option>
                        <option value="Chicken Stew">Chicken Stew</option>
                        <option value="Pilau Rice">Pilau Rice</option>
                        <option value="Mützig Beer">Mützig Beer</option>
                        <option value="Matoke Stew">Matoke Stew</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm mb-2">Delivery Address</label>
                <input type="text" id="address" required class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4">
            </div>

            <button type="submit" 
                    class="w-full py-6 bg-teal-400 hover:bg-teal-500 text-slate-900 font-bold text-xl rounded-3xl">
                PLACE ORDER NOW
            </button>
        </form>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show success message
            document.getElementById('success').classList.remove('hidden');
            
            // Reset form
            this.reset();
            
            // Hide message after 5 seconds
            setTimeout(() => {
                document.getElementById('success').classList.add('hidden');
            }, 5000);
        });

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const icon = document.getElementById('hamburger');
            menu.classList.toggle('hidden');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        }
    </script>
</body>
<footer class="bg-slate-900 py-12">
        <div class="max-w-7xl mx-auto px-6 text-center text-slate-400">

        </div>
    </footer>
